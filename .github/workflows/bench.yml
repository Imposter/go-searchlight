name: bench

# Comparative numbers drift with every commit and ES has real cost to run, so this never
# runs on push or pull_request: only on demand, or once a week to catch regressions.
on:
  workflow_dispatch:
    inputs:
      docs:
        description: "product documents to generate (e.g. 50k, 1m, 10m)"
        default: "1m"
        required: false
      searches:
        description: "saved-search set sizes (comma-separated)"
        default: "1k,10k,100k"
        required: false
      runner:
        description: "runner label; the default ubuntu-latest (~7 GB RAM) caps 'docs' at 1,000,000 — use a self-hosted or larger runner for more"
        default: "ubuntu-latest"
        required: false
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC

permissions:
  contents: read

# Scoped per ref, not a single repo-wide "bench": GitHub Actions concurrency holds at
# most one running and one pending run per group, so a shared group is not a FIFO
# queue -- a second dispatch while one is already pending CANCELS the first pending
# run rather than queuing behind it, repo-wide, across every branch. Observed directly
# while landing this change: two sibling Task 14 branches' own dispatches of this same
# workflow (on their own refs) each cancelled the other's still-pending run before it
# ever started a job. Per-ref groups still serialize two dispatches on the SAME
# branch (the original intent: one bench run per ref at a time), without one
# branch's dispatch starving another's.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: slbench vs Elasticsearch
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # The default --visible-iterations (1000, minSamples(0.99)) costs roughly 36
    # extra minutes by itself (bench/workloads/suite.go's VisibleIterations comment
    # has the measured per-iteration cost). On top of that, --repeats (default 3)
    # reruns every filter/sorted/aggs/percolate-single workload for stable p99s
    # (target: run-to-run variance), and --es-recovery adds Elasticsearch's own
    # peer-recovery timing (target T8) to the Searchlight-only recovery workload
    # that already ran here. 240 leaves room for a 1M-document run's load, searches,
    # aggregations, percolation and both engines' recovery; narrow it back down
    # once a real 1M run's wall time is measured.
    timeout-minutes: 240
    # The recovery workload (target T8: a new replica from zero to serving) needs a
    # second Searchlight node, and so a store two nodes can share: this Postgres, for a
    # cluster of slbench's own beside the SQLite node every other workload runs on.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: searchlight
          POSTGRES_PASSWORD: searchlight
          POSTGRES_DB: searchlight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchlight -d searchlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DOCS: ${{ inputs.docs || '1m' }}
      SEARCHES: ${{ inputs.searches || '1k,10k,100k' }}
      RUNNER_LABEL: ${{ inputs.runner || 'ubuntu-latest' }}
      DATA_DIR: ${{ github.workspace }}/.bench-data
      SL_DIR: ${{ github.workspace }}/.bench-sl
      RECOVERY_STORE_URL: postgres://searchlight:searchlight@127.0.0.1:5432/searchlight?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: size the run to the runner
        run: |
          to_n() {
            case "$1" in
              *m) echo $(( ${1%m} * 1000000 ));;
              *k) echo $(( ${1%k} * 1000 ));;
              *) echo "$1";;
            esac
          }
          N=$(to_n "$DOCS")
          echo "DOCS_N=$N" >> "$GITHUB_ENV"
          # ubuntu-latest has ~7 GB RAM: Elasticsearch's heap, Searchlight's RSS, Docker
          # and the OS all have to fit beside the dataset's indexes. Measured so far
          # (bench/testdata/smoke-report.md, an in-process 50k-document run) only
          # bounds a smoke-sized dataset; until a real standalone-process measurement
          # at 1M exists, 1,000,000 documents is the agreed ceiling on this runner.
          # Pass a 'runner' input naming a self-hosted or larger runner for more.
          if [ "$RUNNER_LABEL" = "ubuntu-latest" ] && [ "$N" -gt 1000000 ]; then
            echo "::error::$DOCS documents (>1,000,000) does not fit the default ubuntu-latest runner (~7 GB RAM). Re-run with a 'runner' input naming a self-hosted or larger runner." >&2
            exit 1
          fi
          # Size the Elasticsearch heap to the dataset: roughly 1 GiB per 300k
          # documents, floor 1g; on the default runner, capped at 3g to leave room for
          # Searchlight, Docker and the OS in ~7 GB total. A larger 'runner' lifts the
          # cap along with the document ceiling above.
          #
          # bench/docker-compose.es.yml now runs TWO Elasticsearch nodes (target T8's
          # peer-recovery baseline), both at this same heap, never tuned down for
          # either one (see that file's comment) -- so the real memory cost on the
          # default runner is roughly double this HEAP_GB, on top of everything else
          # already sharing the ~7 GB. If that runs out of memory at 1M documents,
          # the fix is a larger 'runner' input, not a smaller heap on one node.
          HEAP_GB=$(( (N + 299999) / 300000 ))
          if [ "$HEAP_GB" -lt 1 ]; then HEAP_GB=1; fi
          if [ "$RUNNER_LABEL" = "ubuntu-latest" ] && [ "$HEAP_GB" -gt 3 ]; then HEAP_GB=3; fi
          echo "ES_HEAP=${HEAP_GB}g" >> "$GITHUB_ENV"
          echo "sizing: $DOCS documents (~$N), Elasticsearch heap ${HEAP_GB}g per node (x2 nodes), runner $RUNNER_LABEL"

      # Each recovery-cluster node opens up to 64 connections plus one for LISTEN; two
      # nodes and slbench's own pass the image's default of 100.
      - name: raise Postgres's max_connections
        env:
          PG: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG" psql -U searchlight -d searchlight -c "ALTER SYSTEM SET max_connections = 300"
          docker restart "$PG"
          until docker exec "$PG" pg_isready -U searchlight -d searchlight; do sleep 1; done

      # slbench runs the real binary itself, as a child process: on SQLite with a
      # generated tokens file, restarted for the restart workload (T9), and two more on
      # Postgres for the recovery workload (T8). It stops them when it is done.
      - name: build slbench and searchlight
        run: |
          go build -o /tmp/slbench ./bench/cmd/slbench
          make build

      - name: start Elasticsearch
        run: docker compose -f bench/docker-compose.es.yml up -d

      # wait_for_nodes=2 as well as yellow: --es-recovery below needs the second node
      # (elasticsearch2) actually joined, not just the first one answering.
      - name: wait for Elasticsearch
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&wait_for_nodes=2&timeout=5s" >/dev/null; then
              echo "elasticsearch is up (2 nodes)"
              exit 0
            fi
            sleep 5
          done
          echo "elasticsearch did not become healthy with 2 nodes" >&2
          docker compose -f bench/docker-compose.es.yml logs
          exit 1

      - name: generate dataset
        run: |
          mkdir -p "$DATA_DIR"
          /tmp/slbench gen -out "$DATA_DIR" -docs "$DOCS" -searches "$SEARCHES" -seed 1

      - name: run workloads
        id: run
        run: |
          DATA_FILE=$(ls "$DATA_DIR"/products-*.ndjson | head -1)
          SEARCH_FILE=$(ls "$DATA_DIR"/searches-*.ndjson | sort -t- -k2 -V | tail -1)
          # The host-visible PID of es1 (the node slbench talks to), so its RSS is read
          # the same way as Searchlight's: /proc/<pid>/status VmRSS of the actual
          # server process, not a container-wide cgroup estimate that counts page
          # cache differently (T6 ruling, 2026-10-05: measure RSS the same way for
          # both engines).
          ES_PID=$(docker inspect -f '{{.State.Pid}}' slbench-elasticsearch)
          /tmp/slbench run \
            --data "$DATA_FILE" \
            --searches "$SEARCH_FILE" \
            --sets "$SEARCHES" \
            --sl-bin bin/searchlight \
            --sl-dir "$SL_DIR" \
            --pprof-dir "$SL_DIR/pprof" \
            --recovery-store-url "$RECOVERY_STORE_URL" \
            --es-url "http://127.0.0.1:9200" \
            --es-pid "$ES_PID" \
            --es-config "heap_max=${ES_HEAP}" \
            --es-recovery \
            --repeats 1 \
            --label "CI (${{ github.sha }})" \
            --out "$DATA_DIR/bench-results.json" \
            --md docs/benchmarks.md \
            --stop-on-mismatch
          # No --allow-mismatch: an untolerated engine disagreement must fail this job
          # (exit code 3), not just a line in the report.
          #
          # --repeats 1 (not the CLI's own default of 3): two back-to-back dispatches
          # at 1M documents (identical otherwise) each got cut off by what looks like
          # an execution ceiling well under this job's own 240-minute timeout-minutes
          # (109 min and 120 min; main's own unmodified baseline run finished cleanly
          # in 106 min, so the margin here is tight) -- right as Elasticsearch's own
          # recovery measurement (the heaviest addition besides repeats) was about to
          # start, both times. Until that ceiling is understood (it is not this
          # workflow's own setting) or the run is otherwise trimmed, 1M-document CI
          # dispatches drop the repeat multiplier to fit; --repeats 2 or 3 is still
          # the better choice for a smaller or more leisurely run.
        continue-on-error: true

      # Captured before the services stop (docker compose down drops the
      # containers, and with them "docker compose logs"), so a failure like the
      # loader's "context canceled" (slbench: searchlight: loading: context
      # canceled, every target NOT MEASURED) can be diagnosed from the artifact
      # and the job log instead of being a dead end: searchlight.log (and, for the
      # recovery cluster's nodes, recovery/*/searchlight.log) has the request
      # Searchlight actually refused or crashed on, and the ES container log has the
      # same for Elasticsearch.
      - name: collect server logs
        if: always()
        run: |
          docker compose -f bench/docker-compose.es.yml logs --no-color --timestamps \
            > "$SL_DIR/elasticsearch.log" 2>&1 || true
          if [ "${{ steps.run.outcome }}" = "failure" ]; then
            echo "::group::searchlight.log (tail, run workloads failed)"
            tail -n 200 "$SL_DIR/searchlight.log" 2>/dev/null || echo "(no $SL_DIR/searchlight.log)"
            echo "::endgroup::"
            echo "::group::elasticsearch.log (tail, run workloads failed)"
            tail -n 200 "$SL_DIR/elasticsearch.log" 2>/dev/null || echo "(no $SL_DIR/elasticsearch.log)"
            echo "::endgroup::"
          fi

      - name: stop Elasticsearch
        if: always()
        run: docker compose -f bench/docker-compose.es.yml down -v

      - name: upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: |
            docs/benchmarks.md
            ${{ env.DATA_DIR }}/bench-results.json
            ${{ env.SL_DIR }}/searchlight.log
            ${{ env.SL_DIR }}/recovery/*/searchlight.log
            ${{ env.SL_DIR }}/elasticsearch.log
            ${{ env.SL_DIR }}/pprof/*
          if-no-files-found: warn
          retention-days: 90

      - name: fail if the run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
