name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs these checks as its gate.
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when release.yml calls this file, so the gate of a
# release never cancels, or is cancelled by, a CI run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test:
    # The short tier answers in minutes; the heavy job runs every test, the short
    # tier's included, so it alone keeps the suite's full coverage.
    name: test ${{ matrix.tier }} -race (SQLite, Postgres, MySQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: short
            target: test TESTFLAGS=-race
          - tier: heavy
            target: test-race
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: searchlight
          POSTGRES_PASSWORD: searchlight
          POSTGRES_DB: searchlight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U searchlight -d searchlight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: searchlight
          MYSQL_USER: searchlight
          MYSQL_PASSWORD: searchlight
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      SEARCHLIGHT_TEST_PG_URL: postgres://searchlight:searchlight@127.0.0.1:5432/searchlight?sslmode=disable
      SEARCHLIGHT_TEST_MYSQL_URL: mysql://searchlight:searchlight@127.0.0.1:3306/searchlight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: make build
      - name: test
        run: make ${{ matrix.target }}

  windows:
    name: build, test -short, smoke and NTFS heavy (Windows, SQLite)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # A fault dumps every goroutine, the runtime's frames among them.
      GOTRACEBACK: system
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      # golang/go#79249: tools/ldflags.sh links asyncpreemptoff=1 into the test binaries'
      # runtime defaults, as it does into the release binary. GODEBUG is not set here, so
      # the binaries the smoke tests build without those flags turn it off themselves
      # (cmd/searchlight/preempt_windows.go), and TestWindowsBinaryAsyncPreemptOff checks
      # both ways.
      - name: test
        # -race needs cgo, and Searchlight is pure Go; Linux covers -race.
        run: |
          ldflags=$(sh tools/ldflags.sh -godebug)
          go test -ldflags "$ldflags" -short ./...
      - name: smoke
        # From the heavy tier: the binary built, run, interrupted and restarted
        # (TestSmokeBinary), every benchmark workload driven against the binary run as its
        # own process (TestEndToEndBinary), and the binary built as the release builds it
        # and as "go install" does, each running with async preemption off
        # (TestWindowsBinaryAsyncPreemptOff).
        run: |
          ldflags=$(sh tools/ldflags.sh -godebug)
          go test -ldflags "$ldflags" -run '^(TestSmokeBinary|TestEndToEndBinary|TestWindowsBinaryAsyncPreemptOff)$' \
            ./cmd/searchlight ./bench/cmd/slbench
      - name: heavy tier of the NTFS-sensitive packages
        # WAL checkpointing, merge-and-rename and large-file I/O on a real NTFS volume.
        run: |
          ldflags=$(sh tools/ldflags.sh -godebug)
          go test -ldflags "$ldflags" -timeout 20m ./internal/store/... ./internal/shard/... ./internal/segment/...

  docker:
    name: image, compose and Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: compose files are valid
        run: docker compose -f deploy/compose.yml config --quiet
      - name: the compose samples and deploy/.env.example agree
        # .env.example names every variable the samples read, and its values are their
        # defaults: each sample reads the same with it as without it.
        working-directory: deploy
        run: |
          touch tokens
          for f in compose.postgres.yml compose.sqlite.yml; do
            docker compose -f "$f" config --quiet
            diff <(docker compose -f "$f" config) <(docker compose --env-file .env.example -f "$f" config)
          done
          rm tokens
          diff <(grep -ohE '\$\{[A-Z_]+' compose.postgres.yml compose.sqlite.yml | cut -c3- | sort -u) \
            <(grep -oE '^[A-Z_]+=' .env.example | tr -d = | sort -u)
      # Dependabot does not track an image pinned inside a run step: bump this one by hand
      # from https://github.com/yannh/kubeconform/releases, digest included
      # (docker buildx imagetools inspect ghcr.io/yannh/kubeconform:<tag>).
      - name: Kubernetes manifests are valid
        run: >-
          docker run --rm -v "$PWD/deploy/k8s:/k8s:ro"
          ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary /k8s
      - name: build the image (not pushed)
        run: make docker IMAGE=searchlight:dev
      - name: the image runs as non-root, with its healthcheck
        run: |
          docker run --rm searchlight:dev -h > /dev/null
          docker run --rm searchlight:dev version | grep '^searchlight '
          test "$(docker image inspect -f '{{.Config.User}}' searchlight:dev)" = "65532:65532"
          docker image inspect -f '{{json .Config.Healthcheck.Test}}' searchlight:dev | grep -q '"healthcheck"'
          if docker run --rm searchlight:dev healthcheck; then echo "healthcheck passed with no node running"; exit 1; fi
      - name: the image is built with go.mod's toolchain, and carries the licences
        # A Dependabot bump of the golang image's digest to another Go release fails here
        # until go.mod's toolchain line follows it: the release binaries use that line.
        run: |
          toolchain=$(sed -n 's/^toolchain //p' go.mod)
          docker run --rm searchlight:dev version | grep -F "($toolchain, linux/amd64)"
          docker create --name licences searchlight:dev > /dev/null
          docker cp licences:/usr/share/doc/searchlight "$RUNNER_TEMP/doc"
          docker rm licences > /dev/null
          cmp LICENSE "$RUNNER_TEMP/doc/LICENSE"
          grep -q "^Go $toolchain, its runtime and standard library" "$RUNNER_TEMP/doc/THIRD_PARTY_NOTICES"
          grep -q "^github.com/jackc/pgx/v5 " "$RUNNER_TEMP/doc/THIRD_PARTY_NOTICES"
      - name: start the compose cluster (the command docs/operations.md gives)
        run: docker compose -f deploy/compose.yml up --build -d
      - name: the compose cluster serves
        run: |
          compose="docker compose -f deploy/compose.yml"
          for node in 1 2 3; do
            for i in $(seq 1 90); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "searchlight-searchlight-$node-1")" = healthy ] && break
              [ "$i" = 90 ] && { echo "node $node never became healthy"; exit 1; }
              sleep 2
            done
          done
          for port in 8781 8783 8785; do
            curl -fsS "http://127.0.0.1:$port/readyz" > /dev/null
          done
          token=$($compose run --rm --no-deps -T secrets sh -c 'grep " write$" /secrets/tokens | cut -d" " -f1')
          auth="Authorization: Bearer $token"
          curl -fsS -X PUT -H "$auth" -H 'Content-Type: application/json' http://127.0.0.1:8780/indexes/ci \
            -d '{"mapping": {"fields": {"brand": "keyword", "price": "number"}}, "settings": {"shards": 2}}'
          seq=$(printf '%s\n' '{"upsert": {"id": "a"}}' '{"brand": "acme", "price": 5}' '{"upsert": {"id": "b"}}' '{"brand": "other", "price": 50}' |
            curl -fsS -X POST -H "$auth" -H 'Content-Type: application/x-ndjson' --data-binary @- http://127.0.0.1:8782/indexes/ci/_bulk |
            jq -er .seq)
          total=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            "http://127.0.0.1:8784/indexes/ci/_search?wait_for_seq=$seq" \
            -d '{"query": {"field": "brand", "op": "eq", "value": "ACME"}}' | jq -er .total.value)
          test "$total" = 1
          curl -fsS -H "$auth" http://127.0.0.1:8780/_cluster/health | jq -e '.nodes == 3'
          start=$(date +%s)
          $compose stop searchlight-1
          test "$(docker inspect -f '{{.State.ExitCode}}' searchlight-searchlight-1-1)" = 0
          test $(( $(date +%s) - start )) -le 75
      - name: compose logs
        if: always()
        run: docker compose -f deploy/compose.yml logs --no-color --tail 200 || true
      - name: compose down
        if: always()
        run: docker compose -f deploy/compose.yml down -v || true
      # The samples run the published image; here they run this commit's, tagged as the
      # version "ci" so Compose finds it locally instead of pulling.
      - name: the Postgres sample serves, through nginx
        env:
          SEARCHLIGHT_VERSION: ci
        run: |
          docker tag searchlight:dev ghcr.io/imposter/searchlight:ci
          compose="docker compose -f deploy/compose.postgres.yml"
          $compose up -d
          token=$($compose run --rm --no-deps -T secrets sh -c 'grep " write$" /secrets/tokens | cut -d" " -f1')
          SMOKE_TOKEN=$token .github/scripts/smoke.sh http://127.0.0.1:8080 http://127.0.0.1:8080
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8080/_cluster/health | jq -e '.nodes == 3'
      - name: Postgres sample logs
        if: always()
        env:
          SEARCHLIGHT_VERSION: ci
        run: docker compose -f deploy/compose.postgres.yml logs --no-color --tail 200 || true
      - name: Postgres sample down
        if: always()
        env:
          SEARCHLIGHT_VERSION: ci
        run: docker compose -f deploy/compose.postgres.yml down -v || true
      - name: the SQLite sample serves, and stops cleanly
        env:
          SEARCHLIGHT_VERSION: ci
        run: |
          token=$(openssl rand -hex 24)
          printf '%s write\n' "$token" > deploy/tokens
          compose="docker compose -f deploy/compose.sqlite.yml"
          $compose up -d
          SMOKE_TOKEN=$token .github/scripts/smoke.sh http://127.0.0.1:8780 http://127.0.0.1:8781
          $compose stop
          test "$(docker inspect -f '{{.State.ExitCode}}' searchlight-sqlite-searchlight-1)" = 0
      - name: SQLite sample logs and down
        if: always()
        env:
          SEARCHLIGHT_VERSION: ci
        run: |
          docker compose -f deploy/compose.sqlite.yml logs --no-color --tail 200 || true
          docker compose -f deploy/compose.sqlite.yml down -v || true
