name: release

# Builds, tests and publishes a Searchlight release (RELEASING.md):
#
#   - version: the version, from the tag (or, in a dry run on a branch, CHANGELOG.md's
#     newest release), its CHANGELOG.md section as the release notes, and the deploy
#     samples' image tags checked against it;
#   - gate: every CI check (ci.yml, called);
#   - binaries: static binaries for five platforms, archived with the docs, the deploy
#     bundle (the compose samples, .env.example, nginx and Kubernetes), and SHA256SUMS;
#   - smoke: each archive unpacked and run on its own platform (darwin/amd64 under
#     Rosetta 2) on SQLite: ready, an index created, a document indexed and found;
#   - image: the linux/amd64 and linux/arm64 images built, each run on SQLite and probed
#     the same way (arm64 under QEMU), then pushed to ghcr.io/imposter/searchlight as
#     <version>, <major>.<minor>, <major> and latest, with provenance and an SBOM;
#   - release: the GitHub release for the tag, with the archives, the bundle and
#     SHA256SUMS.
#
# A pushed v*.*.* tag publishes once everything before it passes. workflow_dispatch with
# dry_run (the default) runs every build and test and publishes nothing; publishing
# needs a tag, so dry_run=false is refused on a branch.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test everything, publish nothing (publishing runs only on a v*.*.* tag)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/imposter/searchlight

jobs:
  version:
    name: version and release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the version
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$tag is not on main: cut releases from main"
              exit 1
            fi
          elif [ "$DRY_RUN" = true ]; then
            tag=v$(sed -nE 's/^## \[([0-9][^]]*)\].*/\1/p' CHANGELOG.md | head -n 1)
          else
            echo "::error::only a v*.*.* tag publishes: run on a branch with dry_run"
            exit 1
          fi
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          version=${tag#v}
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          publish=true
          [ "$DRY_RUN" = true ] && publish=false
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "### Searchlight $tag (publish: $publish)" >> "$GITHUB_STEP_SUMMARY"
      - name: the release notes, from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v head="## [$VERSION]" '
            /^## \[/ { if (found) exit; found = index($0, head) == 1; next }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"
            exit 1
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: the deploy samples run this version's image
        if: steps.version.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fail=0
          check() {
            grep -qF -- "$2" "$1" || { echo "::error file=$1::want \"$2\": bump it for $VERSION (RELEASING.md)"; fail=1; }
          }
          check deploy/.env.example "SEARCHLIGHT_VERSION=$VERSION"
          check deploy/compose.postgres.yml "image: $IMAGE:\${SEARCHLIGHT_VERSION:-$VERSION}"
          check deploy/compose.sqlite.yml "image: $IMAGE:\${SEARCHLIGHT_VERSION:-$VERSION}"
          check deploy/k8s/statefulset.yaml "image: $IMAGE:$VERSION"
          exit "$fail"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  gate:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    name: binaries and the deploy bundle
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build and archive
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          epoch=$(git log -1 --format=%ct)
          pack() {
            if [[ $1 == *-windows-* ]]; then
              find "build/$1" -exec touch -d "@$epoch" {} +
              (cd build && zip -qrX "../dist/$1.zip" "$1")
            else
              tar -C build --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner -cf - "$1" |
                gzip -9n > "dist/$1.tar.gz"
            fi
          }
          mkdir -p build dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name=searchlight-$VERSION-$os-$arch
            exe=searchlight
            [ "$os" = windows ] && exe=searchlight.exe
            mkdir -p "build/$name/docs"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "build/$name/$exe" ./cmd/searchlight
            chmod 0755 "build/$name/$exe"
            cp README.md "build/$name/"
            cp docs/operations.md "build/$name/docs/"
            cp LICENSE "build/$name/"
            pack "$name"
          done
          bundle=searchlight-deploy-$VERSION
          mkdir -p "build/$bundle"
          cp LICENSE deploy/compose.postgres.yml deploy/compose.sqlite.yml deploy/.env.example "build/$bundle/"
          cp -R deploy/nginx deploy/k8s "build/$bundle/"
          pack "$bundle"
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: the linux/amd64 binary reports its version
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: '"build/searchlight-$VERSION-linux-amd64/searchlight" version | grep "^searchlight $TAG (go"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.os }}/${{ matrix.arch }}
    needs: [version, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: darwin, arch: arm64, runner: macos-latest }
          # No Intel macOS runner is left free of charge: this runs under Rosetta 2.
          - { os: darwin, arch: amd64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.version.outputs.tag }}
      NAME: searchlight-${{ needs.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
      PLATFORM: ${{ matrix.os }}/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Rosetta 2
        if: matrix.os == 'darwin' && matrix.arch == 'amd64'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: check the archive's checksum and unpack it
        working-directory: dist
        run: |
          grep -E "  $NAME\.(tar\.gz|zip)\$" SHA256SUMS > mine
          if command -v sha256sum > /dev/null; then sha256sum -c mine; else shasum -a 256 -c mine; fi
          if [ -f "$NAME.zip" ]; then 7z x -y "$NAME.zip" > /dev/null; else tar -xzf "$NAME.tar.gz"; fi
          ls -R "$NAME"
      - name: run it on SQLite, probe it, stop it
        env:
          OS: ${{ matrix.os }}
        run: |
          root=$PWD
          bin=$root/dist/$NAME/searchlight
          [ "$OS" = windows ] && bin=$bin.exe
          "$bin" version | tee version.txt
          grep -q "^searchlight $TAG (go[^,]*, $PLATFORM)" version.txt
          work=$(mktemp -d)
          echo "WORK=$work" >> "$GITHUB_ENV"
          cd "$work"
          "$bin" --store_url=sqlite:searchlight.db --data_dir=data --insecure_no_auth \
            --listen=127.0.0.1:8780 --admin_listen=127.0.0.1:8781 --shutdown_grace=100ms > node.log 2>&1 &
          pid=$!
          SMOKE_PID=$pid "$root/.github/scripts/smoke.sh" http://127.0.0.1:8780 http://127.0.0.1:8781
          # Windows has no SIGTERM; ci.yml's TestSmokeBinary covers its stop (CTRL_BREAK).
          if [ "$OS" = windows ]; then
            kill "$pid"
            exit 0
          fi
          kill -TERM "$pid"
          status=0
          wait "$pid" || status=$?
          if [ "$status" != 0 ]; then
            echo "::error::SIGTERM stopped the node with exit status $status, want 0"
            exit 1
          fi
      - name: the node's log
        if: always()
        run: cat "$WORK/node.log" 2> /dev/null || true

  image:
    name: image (linux/amd64, linux/arm64)
    needs: [version, gate, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.tag }}
          flavor: latest=auto
          labels: |
            org.opencontainers.image.title=searchlight
            org.opencontainers.image.description=A search engine that behaves like Elasticsearch and keeps its durable state in SQL.
            org.opencontainers.image.documentation=https://github.com/Imposter/go-searchlight/blob/main/docs/operations.md
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=A search engine that behaves like Elasticsearch and keeps its durable state in SQL.
      - name: build arguments
        id: args
        env:
          CREATED: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
        run: |
          {
            echo 'build-args<<EOF'
            echo "VERSION=$TAG"
            echo "REVISION=$GITHUB_SHA"
            echo "CREATED=$CREATED"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: build the linux/amd64 image to test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: ${{ steps.args.outputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          load: true
          tags: searchlight:smoke-amd64
      - name: build the linux/arm64 image to test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          build-args: ${{ steps.args.outputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          load: true
          tags: searchlight:smoke-arm64
      - name: run each image on SQLite and probe it
        run: |
          for arch in amd64 arm64; do
            image=searchlight:smoke-$arch
            echo "::group::linux/$arch"
            test "$(docker image inspect -f '{{.Architecture}}' "$image")" = "$arch"
            test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "${TAG#v}"
            docker run --rm --platform "linux/$arch" "$image" version | grep "^searchlight $TAG (go[^,]*, linux/$arch)"
            docker run -d --name "smoke-$arch" --platform "linux/$arch" \
              -p 127.0.0.1:8780:8780 -p 127.0.0.1:8781:8781 \
              -e SEARCHLIGHT_STORE_URL=sqlite:///var/lib/searchlight/searchlight.db \
              -e SEARCHLIGHT_INSECURE_NO_AUTH=true -e SEARCHLIGHT_SHUTDOWN_GRACE=100ms \
              "$image"
            SMOKE_TIMEOUT=300 .github/scripts/smoke.sh http://127.0.0.1:8780 http://127.0.0.1:8781
            for i in $(seq 1 60); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "smoke-$arch")" = healthy ] && break
              [ "$i" = 60 ] && { echo "::error::the $arch image's HEALTHCHECK never passed"; exit 1; }
              sleep 2
            done
            docker stop "smoke-$arch"
            test "$(docker inspect -f '{{.State.ExitCode}}' "smoke-$arch")" = 0
            docker logs "smoke-$arch" 2>&1 | tail -n 5
            docker rm "smoke-$arch"
            echo "::endgroup::"
          done
      - name: the smoke containers' logs
        if: failure()
        run: |
          for arch in amd64 arm64; do
            docker logs "smoke-$arch" 2>&1 | tail -n 100 || true
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A dry run builds both platforms with their attestations too, and keeps nothing.
      - name: build both platforms, and push them when publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.args.outputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          push: ${{ needs.version.outputs.publish == 'true' }}
      - name: the tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          {
            echo "### Image (pushed: $PUBLISH)"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: [version, gate, binaries, smoke, image]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Searchlight $TAG" --notes-file release-notes.md ${flags[@]+"${flags[@]}"}
