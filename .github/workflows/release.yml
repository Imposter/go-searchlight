name: release

# Builds, tests and publishes a Searchlight release (RELEASING.md):
#
#   - preflight: the version, from the tag (or, in a dry run on a branch, CHANGELOG.md's
#     newest release); the image tags it moves; a refusal if its GitHub release exists
#     already; its CHANGELOG.md section as the release notes; and the deploy samples'
#     image tags checked against it;
#   - CI and chaos: every check of ci.yml and chaos.yml, called as the gate;
#   - binaries: static binaries for five platforms, built with go.mod's toolchain and the
#     flags of tools/ldflags.sh (the Windows one with async preemption off), archived
#     with the licence, the third-party notices and the docs; the deploy bundle (the
#     compose samples, .env.example, nginx and Kubernetes); and SHA256SUMS;
#   - smoke: each archive unpacked and run on its own platform (darwin/amd64 under
#     Rosetta 2) on SQLite: ready, an index created, a document indexed and found; the
#     Windows binary also seen running with async preemption off;
#   - image: the linux/amd64 and linux/arm64 image built once, with provenance and an
#     SBOM, and pushed by digest to a staging tag, sha-<commit>;
#   - image smoke: that digest pulled on a native runner per platform and checked: the
#     same Go and the same notices as the archives, then run and probed like them;
#   - image tags: the tested digest tagged <version>, and <major>.<minor>, <major> and
#     latest when this release is the newest of each;
#   - release: the GitHub release for the tag, with the archives, the bundle and
#     SHA256SUMS.
#
# A pushed v*.*.* tag publishes once everything before it passes. workflow_dispatch with
# dry_run (the default) builds and tests the same things and writes nothing to the
# registry or the releases; publishing needs a tag, so dry_run=false is refused on a
# branch. One publishing run at a time, so two never race for the moving tags; dry runs
# queue in their own group, so dispatching one never cancels a waiting tag run.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test everything, publish nothing (publishing runs only on a v*.*.* tag)"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ${{ (github.event_name == 'push' || !inputs.dry_run) && 'release' || 'release-dry-run' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/imposter/searchlight

jobs:
  preflight:
    name: preflight (version, tags, notes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
      created: ${{ steps.version.outputs.created }}
      staging: ${{ steps.version.outputs.staging }}
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the version
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag=$REF_NAME
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$tag is not on main: cut releases from main"
              exit 1
            fi
          elif [ "$DRY_RUN" = true ]; then
            tag=v$(sed -nE 's/^## \[([0-9][^]]*)\].*/\1/p' CHANGELOG.md | head -n 1)
          else
            echo "::error::only a v*.*.* tag publishes: run on a branch with dry_run"
            exit 1
          fi
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          version=${tag#v}
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          publish=true
          [ "$DRY_RUN" = true ] && publish=false
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
            echo "created=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd)"
            echo "staging=sha-$(git rev-parse --short=12 HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "### Searchlight $tag (publish: $publish)" >> "$GITHUB_STEP_SUMMARY"
      - name: the image tags, which only move forward
        id: tags
        # <major>.<minor>, <major> and latest go to this release only when it is the
        # newest stable release of that line: a patch to an older line moves none of them.
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          tags=$VERSION
          if [ "$PRERELEASE" = false ]; then
            major=${VERSION%%.*}
            minor=${VERSION%.*}
            stable=$({ git tag -l --sort=-v:refname 'v*'; echo "$TAG"; } |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -u -rV)
            newest() { grep -E "^v$1\\." <<< "$stable" | head -n 1; }
            [ "$(newest "${minor//./\\.}")" = "$TAG" ] && tags="$tags $minor"
            [ "$(newest "$major")" = "$TAG" ] && tags="$tags $major"
            [ "$(head -n 1 <<< "$stable")" = "$TAG" ] && tags="$tags latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Image tags: \`$tags\`" >> "$GITHUB_STEP_SUMMARY"
      - name: the release does not exist yet
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "::error::the release $TAG exists already: re-run the failed jobs of its run instead (RELEASING.md)"
            exit 1
          fi
          if ! grep -q "release not found" <<< "$out"; then
            echo "::error::cannot tell whether the release $TAG exists: $out"
            exit 1
          fi
      - name: the release notes, from CHANGELOG.md
        # Relative links resolve against the release page there, so they point at the
        # tag's files instead.
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BLOB: ${{ github.server_url }}/${{ github.repository }}/blob
        run: |
          awk -v head="## [$VERSION]" '
            /^## \[/ { if (found) exit; found = index($0, head) == 1; next }
            found
          ' CHANGELOG.md |
            perl -pe 's{\]\((?!https?://|#|mailto:)([^)\s]+)\)}{]($ENV{BLOB}/$ENV{TAG}/$1)}g' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no \"## [$VERSION]\" section"
            exit 1
          fi
          if grep -nP '\]\((?!https?://|#|mailto:)' release-notes.md; then
            echo "::error::relative links are left in the release notes"
            exit 1
          fi
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: the deploy samples run this version's image
        if: steps.version.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fail=0
          check() {
            grep -qF -- "$2" "$1" || { echo "::error file=$1::want \"$2\": bump it for $VERSION (RELEASING.md)"; fail=1; }
          }
          check deploy/.env.example "SEARCHLIGHT_VERSION=$VERSION"
          check deploy/compose.postgres.yml "image: $IMAGE:\${SEARCHLIGHT_VERSION:-$VERSION}"
          check deploy/compose.sqlite.yml "image: $IMAGE:\${SEARCHLIGHT_VERSION:-$VERSION}"
          check deploy/k8s/statefulset.yaml "image: $IMAGE:$VERSION"
          exit "$fail"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  gate:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  chaos:
    name: chaos
    needs: preflight
    uses: ./.github/workflows/chaos.yml
    permissions:
      contents: read

  binaries:
    name: binaries and the deploy bundle
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build and archive
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          epoch=$(git log -1 --format=%ct)
          toolchain=$(sed -n 's/^toolchain //p' go.mod)
          pack() {
            if [[ $1 == *-windows-* ]]; then
              find "build/$1" -exec touch -d "@$epoch" {} +
              (cd build && zip -qrX "../dist/$1.zip" "$1")
            else
              tar -C build --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner -cf - "$1" |
                gzip -9n > "dist/$1.tar.gz"
            fi
          }
          mkdir -p build dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/}
            name=searchlight-$VERSION-$os-$arch
            exe=searchlight
            [ "$os" = windows ] && exe=searchlight.exe
            mkdir -p "build/$name/docs"
            ldflags=$(GOOS=$os GOARCH=$arch sh tools/ldflags.sh "$TAG")
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "$ldflags" -o "build/$name/$exe" ./cmd/searchlight
            chmod 0755 "build/$name/$exe"
            built=$(go version -m "build/$name/$exe" | head -n 1 | awk '{print $2}')
            if [ "$built" != "$toolchain" ]; then
              echo "::error::$name was built with $built, not go.mod's toolchain $toolchain"
              exit 1
            fi
            GOOS=$os GOARCH=$arch sh tools/notices.sh "build/$name/THIRD_PARTY_NOTICES"
            cp README.md LICENSE "build/$name/"
            cp docs/operations.md "build/$name/docs/"
            pack "$name"
          done
          bundle=searchlight-deploy-$VERSION
          mkdir -p "build/$bundle"
          cp LICENSE deploy/compose.postgres.yml deploy/compose.sqlite.yml deploy/.env.example "build/$bundle/"
          cp -R deploy/nginx deploy/k8s "build/$bundle/"
          pack "$bundle"
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            echo "Built with $toolchain."
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: the linux/amd64 binary reports its version
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: '"build/searchlight-$VERSION-linux-amd64/searchlight" version | grep "^searchlight $TAG (go"'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.os }}/${{ matrix.arch }}
    needs: [preflight, binaries]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: darwin, arch: arm64, runner: macos-latest }
          # No Intel macOS runner is left free of charge: this runs under Rosetta 2.
          - { os: darwin, arch: amd64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      NAME: searchlight-${{ needs.preflight.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
      PLATFORM: ${{ matrix.os }}/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Rosetta 2
        if: matrix.os == 'darwin' && matrix.arch == 'amd64'
        run: arch -x86_64 /usr/bin/true || sudo softwareupdate --install-rosetta --agree-to-license
      - name: check the archive's checksum and unpack it
        working-directory: dist
        run: |
          grep -E "  $NAME\.(tar\.gz|zip)\$" SHA256SUMS > mine
          if command -v sha256sum > /dev/null; then sha256sum -c mine; else shasum -a 256 -c mine; fi
          if [ -f "$NAME.zip" ]; then 7z x -y "$NAME.zip" > /dev/null; else tar -xzf "$NAME.tar.gz"; fi
          ls -R "$NAME"
          test -s "$NAME/LICENSE"
          grep -q "^Third-party notices for Searchlight, $PLATFORM" "$NAME/THIRD_PARTY_NOTICES"
      - name: run it on SQLite, probe it, stop it
        env:
          OS: ${{ matrix.os }}
        run: |
          root=$PWD
          bin=$root/dist/$NAME/searchlight
          [ "$OS" = windows ] && bin=$bin.exe
          "$bin" version | tee version.txt
          grep -q "^searchlight $TAG (go[^,]*, $PLATFORM)" version.txt
          # golang/go#79249: the Windows binary runs with async preemption off unless
          # GODEBUG says otherwise (tools/ldflags.sh).
          if [ "$OS" = windows ]; then
            test "$(env -u GODEBUG SEARCHLIGHT_TEST_PREEMPT_PROBE=1 "$bin")" = asyncpreemptoff=1
            test "$(GODEBUG=asyncpreemptoff=0 SEARCHLIGHT_TEST_PREEMPT_PROBE=1 "$bin")" = asyncpreemptoff=0
          fi
          work=$(mktemp -d)
          echo "WORK=$work" >> "$GITHUB_ENV"
          cd "$work"
          "$bin" --store_url=sqlite:searchlight.db --data_dir=data --insecure_no_auth \
            --listen=127.0.0.1:8780 --admin_listen=127.0.0.1:8781 --shutdown_grace=100ms > node.log 2>&1 &
          pid=$!
          SMOKE_PID=$pid "$root/.github/scripts/smoke.sh" http://127.0.0.1:8780 http://127.0.0.1:8781
          # Windows has no SIGTERM; ci.yml's TestSmokeBinary covers its stop (CTRL_BREAK).
          if [ "$OS" = windows ]; then
            kill "$pid"
            exit 0
          fi
          kill -TERM "$pid"
          status=0
          wait "$pid" || status=$?
          if [ "$status" != 0 ]; then
            echo "::error::SIGTERM stopped the node with exit status $status, want 0"
            exit 1
          fi
      - name: the node's log
        if: always()
        run: cat "$WORK/node.log" 2> /dev/null || true

  image:
    name: image (build once; push by digest to the staging tag)
    needs: [preflight, gate, chaos, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      PUBLISH: ${{ needs.preflight.outputs.publish }}
      STAGING: ${{ needs.preflight.outputs.staging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.preflight.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: where the image goes
        id: out
        # A dry run writes the image, attestations included, to a local OCI archive and
        # nothing to the registry.
        run: |
          if [ "$PUBLISH" = true ]; then
            echo "output=type=registry" >> "$GITHUB_OUTPUT"
          else
            echo "output=type=oci,dest=$RUNNER_TEMP/searchlight.oci.tar" >> "$GITHUB_OUTPUT"
          fi
      - name: build both platforms
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.preflight.outputs.tag }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.preflight.outputs.created }}
          labels: org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
          annotations: |
            index,manifest:org.opencontainers.image.title=searchlight
            index,manifest:org.opencontainers.image.description=A search engine that behaves like Elasticsearch and keeps its durable state in SQL.
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.licenses=MIT
            index,manifest:org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ needs.preflight.outputs.created }}
          tags: ${{ env.IMAGE }}:${{ env.STAGING }}
          outputs: ${{ steps.out.outputs.output }}
          provenance: mode=max
          sbom: true
      - name: the staged digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image (pushed to the staging tag: $PUBLISH)"
            echo "\`$IMAGE:$STAGING\` = \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  image-smoke:
    name: image smoke linux/${{ matrix.arch }}
    needs: [preflight, binaries, image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      ARCH: ${{ matrix.arch }}
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.preflight.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: pull the staged digest
        if: needs.preflight.outputs.publish == 'true'
        run: |
          docker pull --platform "linux/$ARCH" "$IMAGE@$DIGEST"
          echo "REF=$IMAGE@$DIGEST" >> "$GITHUB_ENV"
      # A dry run pushed nothing to pull: build this platform here instead.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: needs.preflight.outputs.publish != 'true'
      - name: build this platform (dry run)
        if: needs.preflight.outputs.publish != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.preflight.outputs.tag }}
            REVISION=${{ github.sha }}
            CREATED=${{ needs.preflight.outputs.created }}
          labels: org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
          provenance: false
          load: true
          tags: searchlight:smoke
      - name: the dry run's image
        if: needs.preflight.outputs.publish != 'true'
        run: echo "REF=searchlight:smoke" >> "$GITHUB_ENV"
      - name: the same Go, licence and notices as the linux/${{ matrix.arch }} archive
        run: |
          test "$(docker image inspect -f '{{.Architecture}}' "$REF")" = "$ARCH"
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' "$REF")" = "$VERSION"
          docker run --rm "$REF" version | grep "^searchlight $TAG (go[^,]*, linux/$ARCH)"
          image=$RUNNER_TEMP/image
          mkdir -p "$image"
          docker create --name extract "$REF" > /dev/null
          docker cp extract:/usr/local/bin/searchlight "$image/searchlight"
          docker cp extract:/usr/share/doc/searchlight "$image/doc"
          docker rm extract > /dev/null
          tar -xzf "dist/searchlight-$VERSION-linux-$ARCH.tar.gz" -C "$RUNNER_TEMP"
          archive=$RUNNER_TEMP/searchlight-$VERSION-linux-$ARCH
          image_go=$(go version -m "$image/searchlight" | head -n 1 | awk '{print $2}')
          archive_go=$(go version -m "$archive/searchlight" | head -n 1 | awk '{print $2}')
          echo "image: $image_go, archive: $archive_go"
          test "$image_go" = "$archive_go"
          cmp "$image/doc/LICENSE" "$archive/LICENSE"
          cmp "$image/doc/THIRD_PARTY_NOTICES" "$archive/THIRD_PARTY_NOTICES"
      - name: run it on SQLite and probe it
        run: |
          docker run -d --name smoke \
            -p 127.0.0.1:8780:8780 -p 127.0.0.1:8781:8781 \
            -e SEARCHLIGHT_STORE_URL=sqlite:///var/lib/searchlight/searchlight.db \
            -e SEARCHLIGHT_INSECURE_NO_AUTH=true -e SEARCHLIGHT_SHUTDOWN_GRACE=100ms \
            "$REF"
          .github/scripts/smoke.sh http://127.0.0.1:8780 http://127.0.0.1:8781
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break
            [ "$i" = 60 ] && { echo "::error::the image's HEALTHCHECK never passed"; exit 1; }
            sleep 2
          done
          docker stop smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0
      - name: the container's log
        if: always()
        run: docker logs smoke 2>&1 | tail -n 100 || true

  image-tags:
    name: image tags (on the tested digest)
    needs: [preflight, image, image-smoke]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      TAGS: ${{ needs.preflight.outputs.tags }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: tag the digest
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$IMAGE:$tag"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          for tag in $TAGS; do
            got=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$tag is $got, not the tested $DIGEST"
              exit 1
            fi
          done
          {
            echo "### Image tags"
            for tag in $TAGS; do echo "- \`$IMAGE:$tag\` = \`$DIGEST\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: [preflight, gate, chaos, binaries, smoke, image-tags]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Searchlight $TAG" --notes-file release-notes.md ${flags[@]+"${flags[@]}"}
