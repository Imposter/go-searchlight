version: "2"

run:
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errname
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    forbidigo:
      # Every timer, sleep and elapsed-time reading in the engine goes through an injected
      # clock.Clock (internal/clock), so tests can drive it with clock.Fake. The rule binds
      # the timer-bearing packages only (see the exclusions); a call that must be the
      # process's own time (a net.Conn deadline, a context deadline, waiting out another
      # process's file handle) says why in its //nolint.
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until|After|AfterFunc|NewTimer|NewTicker|Tick|Sleep)$
          msg: use the injected clock.Clock (internal/clock), not the time package's clock
    govet:
      enable-all: true
      disable:
        - fieldalignment # layout is chosen for readability; hot structs are tuned by benchmark
        - shadow # `err` shadowing is idiomatic
    gosec:
      excludes:
        - G104 # unchecked errors are errcheck's job
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam # values are passed by value on purpose (config.Config)
        - unnamedResult
        - whyNoLint # nolintlint covers it
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    sloglint:
      no-mixed-args: true
      context: scope # use the *Context methods when a context is in scope
      static-msg: true
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - unparam
      # The clock rule binds the production code of shard, replica, cluster, store, node
      # and api. Exempt: internal/clock itself (it wraps the time package), tests, the
      # node's test-support package, bench and cmd (real time is their subject), and
      # every other package.
      - path-except: ^internal/(shard|replica|cluster|store|node|api)/
        linters:
          - forbidigo
      - path: (_test\.go|^internal/node/nodetest/)
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Imposter/go-searchlight
