# A three-node Searchlight cluster on Postgres 17, for trying a cluster out on one
# machine. From the repository root:
#
#   docker compose -f deploy/compose.yml up --build -d
#
# The secrets are generated on the first start, into the "secrets" volume, by the
# one-shot "secrets" service: a Postgres password and the store_url built from it, a
# cluster_token, and a tokens_file with one read-write and one read-only API token.
# Nothing secret is written in this file. Read the API tokens with:
#
#   docker compose -f deploy/compose.yml run --rm secrets cat /secrets/tokens
#
# The nodes serve the API on 127.0.0.1:8780, :8782 and :8784, and their admin listeners
# (/healthz, /readyz, /metrics) on 127.0.0.1:8781, :8783 and :8785. Any node takes any
# request, so an nginx service fronts all three on 127.0.0.1:8080 as the load balancer
# a real deployment needs (docs/nginx.md); the nodes' own ports stay published too, for
# the same local debugging as before.
#
# The nodes' healthchecks run the binary's own probe, "searchlight healthcheck", which
# GETs /readyz on the admin listener. nginx's healthcheck GETs /healthz through itself,
# proxied to whichever node least_conn picks (that route needs no auth).
#
# A node stops within shutdown_grace (5 s) plus shutdown_timeout (60 s, the default);
# stop_grace_period leaves 10 s more before Docker kills it.
#
# The peer API runs over plain HTTP here (the nodes log that the cluster_token is sent
# in the clear): set tls_cert, tls_key and peer_ca_file outside a private network.

name: searchlight

x-searchlight: &searchlight
  image: searchlight:dev
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    args:
      VERSION: compose
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  stop_grace_period: 75s
  healthcheck:
    test: ["CMD", "/usr/local/bin/searchlight", "healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 2m

x-searchlight-env: &searchlight-env
  SEARCHLIGHT_STORE_URL_FILE: /run/secrets/searchlight/store_url
  SEARCHLIGHT_CLUSTER_TOKEN_FILE: /run/secrets/searchlight/cluster_token
  SEARCHLIGHT_TOKENS_FILE: /run/secrets/searchlight/tokens
  SEARCHLIGHT_SHUTDOWN_GRACE: 5s
  SEARCHLIGHT_SHUTDOWN_TIMEOUT: 60s
  SEARCHLIGHT_LOG_LEVEL: info

services:
  secrets:
    image: busybox:1.37-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    restart: "no"
    volumes:
      - secrets:/secrets
    command:
      - sh
      - -euc
      - |
        cd /secrets
        gen() { head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        [ -s postgres_password ] || gen > postgres_password
        [ -s store_url ] || printf 'postgres://searchlight:%s@postgres:5432/searchlight?sslmode=disable' "$$(cat postgres_password)" > store_url
        [ -s cluster_token ] || gen > cluster_token
        [ -s tokens ] || printf '# <token> write | <token> read\n%s write\n%s read\n' "$$(gen)" "$$(gen)" > tokens
        chmod 0444 postgres_password store_url cluster_token tokens

  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    # Each node may hold 64 connections plus one for LISTEN.
    command: ["postgres", "-c", "max_connections=300"]
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: searchlight
      POSTGRES_DB: searchlight
      POSTGRES_PASSWORD_FILE: /run/secrets/searchlight/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/run/secrets/searchlight:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "searchlight", "-d", "searchlight"]
      interval: 5s
      timeout: 5s
      retries: 20

  searchlight-1:
    <<: *searchlight
    hostname: searchlight-1
    environment:
      <<: *searchlight-env
      SEARCHLIGHT_NODE_ID: searchlight-1
      SEARCHLIGHT_ADVERTISE_ADDRESS: searchlight-1:8780
    ports:
      - 127.0.0.1:8780:8780
      - 127.0.0.1:8781:8781
    volumes:
      - data-1:/var/lib/searchlight
      - secrets:/run/secrets/searchlight:ro

  searchlight-2:
    <<: *searchlight
    hostname: searchlight-2
    environment:
      <<: *searchlight-env
      SEARCHLIGHT_NODE_ID: searchlight-2
      SEARCHLIGHT_ADVERTISE_ADDRESS: searchlight-2:8780
    ports:
      - 127.0.0.1:8782:8780
      - 127.0.0.1:8783:8781
    volumes:
      - data-2:/var/lib/searchlight
      - secrets:/run/secrets/searchlight:ro

  searchlight-3:
    <<: *searchlight
    hostname: searchlight-3
    environment:
      <<: *searchlight-env
      SEARCHLIGHT_NODE_ID: searchlight-3
      SEARCHLIGHT_ADVERTISE_ADDRESS: searchlight-3:8780
    ports:
      - 127.0.0.1:8784:8780
      - 127.0.0.1:8785:8781
    volumes:
      - data-3:/var/lib/searchlight
      - secrets:/run/secrets/searchlight:ro

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      searchlight-1:
        condition: service_healthy
      searchlight-2:
        condition: service_healthy
      searchlight-3:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ./nginx/searchlight.conf:/etc/nginx/conf.d/searchlight.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  secrets:
  pgdata:
  data-1:
  data-2:
  data-3:
