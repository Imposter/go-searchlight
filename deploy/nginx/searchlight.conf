# nginx as the dumb load balancer the spec asks for in front of a Searchlight cluster
# (spec §1: "a dumb load balancer in front is enough; clients never need to know the
# topology"). Every node is a coordinator, so this is a plain round-robin/least-conn
# front door, not a proxy that needs to know anything about shards or leases.
#
# This file is deploy/compose.yml's nginx service's conf (mounted read-only at
# /etc/nginx/conf.d/searchlight.conf); outside Compose, replace the upstream
# hostnames and TLS paths for your environment. See docs/nginx.md for the reasoning
# behind every decision below, and docs/clustering.md for how the cluster itself works.
#
# What this does NOT proxy: the admin listener (127.0.0.1:8781 on each node:
# /healthz, /readyz, /metrics, pprof). Give Prometheus and your own probes direct
# access to it instead (docs/nginx.md#the-admin-listener-stays-off-the-proxy).

upstream searchlight_nodes {
    # Any node takes any request (spec §2), so route by current load, not by hashing
    # on anything: least_conn sends the next request to whichever upstream has the
    # fewest open connections right now.
    least_conn;

    # Compose's service names; a node's own container port (8780), not the published
    # host port. Replace with your nodes' advertise_address hosts outside Compose.
    server searchlight-1:8780 max_fails=3 fail_timeout=10s;
    server searchlight-2:8780 max_fails=3 fail_timeout=10s;
    server searchlight-3:8780 max_fails=3 fail_timeout=10s;

    # Reuse connections to the upstreams instead of opening one per request.
    # proxy_http_version 1.1 and clearing Connection (below) are required for this to
    # take effect.
    keepalive 32;
}

server {
    listen 8080;
    # listen 8443 ssl;
    # ssl_certificate     /etc/nginx/certs/searchlight.crt;
    # ssl_certificate_key /etc/nginx/certs/searchlight.key;
    # TLS terminates here; the cluster's internal peer traffic (node to node) never
    # passes through nginx at all, so this is the only TLS nginx needs to manage. See
    # docs/nginx.md#tls.

    server_name _;

    # Matches max_body_bytes' default (16 MiB). Keep this equal to the node's
    # max_body_bytes: smaller and nginx rejects large bulks itself (as 413, before
    # Searchlight's own, more specific 413 with its request_id and problem body);
    # larger just wastes a little buffer space for requests Searchlight will reject
    # anyway. Change both together if you raise max_body_bytes.
    client_max_body_size 16m;

    location / {
        proxy_pass http://searchlight_nodes;

        # Required for the upstream keepalive pool above.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Authorization (the client's bearer token) passes through unchanged: nginx
        # forwards every request header to the upstream by default, and nothing here
        # hides or rewrites it. Do not add "proxy_set_header Authorization ..." or
        # "proxy_hide_header Authorization" — either would break auth.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # request_timeout (30s by default) is Searchlight's own per-request deadline;
        # a well-behaved node always answers (with a problem body, if nothing else)
        # well within it. This just has to be comfortably above that, not above any
        # client-supplied "timeout" field inside a search body, which Searchlight
        # itself enforces and answers with partial results (timed_out: true) rather
        # than hanging. Raise both together if you raise request_timeout.
        proxy_connect_timeout 2s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;

        # Every Searchlight response is a single buffered JSON (or problem JSON) body
        # (internal/api/server.go's writeJSON) — there are no chunked/streamed
        # responses to disable buffering for.

        # Retry a request against another node when this one refused the TCP
        # connection, timed out, or is answering 503 (its own "unavailable": the
        # database is unreachable, or the node is draining for shutdown) — never on
        # 500 or 504, which are the request's own outcome, not the node's
        # availability. Searchlight never answers 502 itself; it's listed because
        # that's nginx's own code for "the connection to the upstream failed".
        #
        # non_idempotent also allows retrying a POST (the _bulk endpoint, and the
        # read-only _search/_count/_percolate), which nginx otherwise never retries
        # on its own. That's safe here specifically because every id Searchlight
        # writes is client-supplied — there is no "create and get back a generated
        # id" endpoint, so a retried bulk can never create a second document under a
        # different id the way retrying, say, Elasticsearch's auto-id POST could. A
        # plain upsert reapplies to the same value harmlessly; an op_type=create or
        # if_seq write that already committed on the first, uncompleted attempt comes
        # back as that operation's own 409 conflict in the bulk response (or as the
        # single write's 409) rather than silently double-applying. See
        # docs/nginx.md#retries for the evidence. PUT and DELETE (single documents and
        # saved queries) are idempotent HTTP methods and are already retried by nginx
        # without this. (proxy_next_upstream's conditions must all be on one line:
        # nginx takes the last occurrence of the directive, not a merge of several.)
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }
}
